<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily</title>

  <!-- 让它可以"添加到主屏幕"、全屏打开 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="theme-color" content="#FFF8F0">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部标题 -->
  <header class="top-bar">
    <div>
      <h1 id="page-title">记账</h1>
      <p id="today" class="today"></p>
    </div>
    <img id="top-mascot" class="top-mascot" src="img/pig.svg" alt="">
  </header>

  <main>
    <!-- ================= 记账 ================= -->
    <section id="page-budget" class="page" data-title="记账" data-mascot="img/pig.svg">
      <div class="card summary mint">
        <div class="month-switch">
          <button class="icon-btn" id="b-prev" aria-label="上个月">‹</button>
          <span id="b-month"></span>
          <button class="icon-btn" id="b-next" aria-label="下个月">›</button>
        </div>
        <div class="summary-label">本月支出</div>
        <div class="summary-total" id="b-total">€0.00</div>
        <div id="b-cats" class="cat-bars"></div>
      </div>

      <div id="b-list" class="list"></div>
      <div id="b-empty" class="empty">
        <img src="img/pig.svg" alt="">
        <p>这个月还没有记账<br>点右下角 ＋ 记第一笔吧</p>
      </div>

      <button class="fab mint-btn" id="b-add" aria-label="记一笔">＋</button>
    </section>

    <!-- ================= 运动 ================= -->
    <section id="page-fitness" class="page" data-title="运动" data-mascot="img/shiba.svg">
      <div class="card summary peach">
        <div class="month-switch">
          <button class="icon-btn" id="f-prev" aria-label="前一天">‹</button>
          <span id="f-day"></span>
          <button class="icon-btn" id="f-next" aria-label="后一天">›</button>
        </div>
        <div class="stat-row">
          <div><div class="stat-num" id="f-week">0</div><div class="stat-label">本周训练天数</div></div>
          <div><div class="stat-num" id="f-count">0</div><div class="stat-label">当天动作数</div></div>
          <div><div class="stat-num" id="f-volume">0</div><div class="stat-label">当天总量 kg</div></div>
        </div>
      </div>

      <div id="f-list" class="list"></div>
      <div id="f-empty" class="empty">
        <img src="img/shiba.svg" alt="">
        <p>这一天还没有训练记录<br>点右下角 ＋ 加一个动作</p>
      </div>

      <h3 class="section-title" id="f-history-title">最近训练</h3>
      <div id="f-history" class="list"></div>

      <button class="fab peach-btn" id="f-add" aria-label="加动作">＋</button>
    </section>

    <!-- ================= 待办 ================= -->
    <section id="page-todo" class="page" data-title="待办" data-mascot="img/cat.svg">
      <form class="card todo-input" id="t-form">
        <input id="t-text" type="text" placeholder="要做什么？比如：买牛奶" autocomplete="off" maxlength="100">
        <button type="submit" class="add-btn lavender-btn">添加</button>
      </form>

      <div class="todo-meta">
        <span id="t-left"></span>
        <button id="t-clear" class="link-btn">清除已完成</button>
      </div>

      <div id="t-list" class="list"></div>
      <div id="t-empty" class="empty">
        <img src="img/cat.svg" alt="">
        <p>没有待办，喵～<br>今天可以好好休息</p>
      </div>
    </section>
  </main>

  <!-- 底部三个按钮 -->
  <nav class="tab-bar">
    <a href="#budget" class="tab" data-page="budget">
      <span class="tab-icon">💰</span><span>记账</span>
    </a>
    <a href="#fitness" class="tab" data-page="fitness">
      <span class="tab-icon">🏋️‍♀️</span><span>运动</span>
    </a>
    <a href="#todo" class="tab" data-page="todo">
      <span class="tab-icon">✅</span><span>待办</span>
    </a>
  </nav>

  <!-- ============ 弹出层：记一笔 ============ -->
  <div class="sheet-bg" id="b-sheet">
    <form class="sheet" id="b-form">
      <div class="sheet-head">
        <h2 id="b-sheet-title">记一笔</h2>
        <button type="button" class="icon-btn close" data-close>✕</button>
      </div>

      <div class="amount-row">
        <select id="b-cur"></select>
        <input id="b-amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
      </div>
      <div class="rate-hint" id="b-rate"></div>

      <label class="field-label">分类</label>
      <div class="chips" id="b-chips"></div>

      <label class="field-label" for="b-note">备注（可不填）</label>
      <input id="b-note" type="text" placeholder="比如：楼下咖啡" maxlength="60" autocomplete="off">

      <label class="field-label" for="b-date">日期</label>
      <input id="b-date" type="date">

      <p class="form-error" id="b-error"></p>
      <button type="submit" class="save-btn mint-btn">保存</button>
      <button type="button" class="delete-btn" id="b-delete">删除这一笔</button>
    </form>
  </div>

  <!-- ============ 弹出层：加动作 ============ -->
  <div class="sheet-bg" id="f-sheet">
    <form class="sheet" id="f-form">
      <div class="sheet-head">
        <h2 id="f-sheet-title">加一个动作</h2>
        <button type="button" class="icon-btn close" data-close>✕</button>
      </div>

      <label class="field-label" for="f-name">动作（点下面选，或直接打字）</label>
      <input id="f-name" type="text" placeholder="比如：深蹲" maxlength="40" autocomplete="off">
      <div class="part-tabs" id="f-parts"></div>
      <div class="chips small" id="f-quick"></div>
      <button type="button" class="link-btn manage-btn" id="f-manage">⚙️ 管理我的动作库</button>

      <label class="field-label">记录方式</label>
      <div class="seg" id="f-type">
        <button type="button" data-type="reps">重量×次数</button>
        <button type="button" data-type="time">重量×秒数</button>
        <button type="button" data-type="cardio">有氧·分钟</button>
      </div>

      <div class="last-time" id="f-last"></div>

      <div id="f-sets-wrap">
        <label class="field-label">每一组</label>
        <div class="set-head"><span>组</span><span>重量 kg</span><span id="f-col2">次数</span><span></span></div>
        <div id="f-sets"></div>
        <button type="button" class="link-btn add-set" id="f-addset">＋ 再加一组（复制上一组）</button>
      </div>

      <div id="f-cardio-wrap">
        <label class="field-label" for="f-min">时长（分钟）</label>
        <input id="f-min" type="text" inputmode="numeric" placeholder="比如：45" autocomplete="off">
      </div>

      <p class="form-error" id="f-error"></p>
      <button type="submit" class="save-btn peach-btn">保存</button>
      <button type="button" class="delete-btn" id="f-delete">删除这个动作</button>
    </form>
  </div>

  <!-- ============ 弹出层：我的动作库 ============ -->
  <div class="sheet-bg" id="lib-sheet">
    <form class="sheet" id="lib-form">
      <div class="sheet-head">
        <h2>我的动作库</h2>
        <button type="button" class="icon-btn close" data-close>✕</button>
      </div>

      <div class="card lib-edit">
        <div class="lib-edit-title" id="lib-edit-title">➕ 添加新动作</div>
        <input id="lib-name" type="text" placeholder="动作名称，比如：哑铃飞鸟" maxlength="40" autocomplete="off">
        <div class="lib-row">
          <select id="lib-part"></select>
          <select id="lib-type">
            <option value="reps">重量×次数</option>
            <option value="time">重量×秒数</option>
            <option value="cardio">有氧·分钟</option>
          </select>
        </div>
        <p class="form-error" id="lib-error"></p>
        <button type="submit" class="save-btn peach-btn" id="lib-save">添加</button>
        <button type="button" class="link-btn lib-cancel" id="lib-cancel">取消修改</button>
      </div>

      <p class="lib-tip">点一个动作可以改名、换部位；点 ✕ 从动作库删除（以前的训练记录不会被删）。</p>
      <div id="lib-list"></div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
